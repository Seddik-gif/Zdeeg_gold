name: Daily Gold Sentiment

on:
  schedule:
    - cron: '0 7 * * 1-5'   # 07:00 UTC = 09:00 CET, Mon–Fri
  workflow_dispatch:

jobs:
  # ── JOB 1: Deploy dashboard to GitHub Pages (no API key needed) ───────
  deploy-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy dashboard to index.html
        run: cp dashboard_template.html index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false

  # ── JOB 2: Send the daily Telegram report ─────────────────────────────
  send-report:
    runs-on: ubuntu-latest
    needs: deploy-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send gold report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python gold_sentiment.py --once
